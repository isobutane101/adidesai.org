<!DOCTYPE html>
<html class="staticrypt-html">
<head>
    <script>
    // Auth lifetime: per-tab session. Reloads and clicking links within the site keep you
    // logged in (sessionStorage); closing the tab clears it, so reopening re-prompts.
    // We only make sure no long-term "remember me" survives a tab close.
    (function () {
      try {
        localStorage.removeItem("staticrypt_passphrase");
        localStorage.removeItem("staticrypt_expiration");
      } catch (e) {}
    })();
    </script>

            width: 100%;
        }

        .login-name {

            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .login-subtitle {
            font-size: 0.875rem;
            color: #888;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .login-input {
            padding: 1rem 1.25rem;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 1rem;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            text-align: center;
            letter-spacing: 0.1em;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            outline: none;
            border-color: #c9a227;
        }

        .login-input::placeholder {
            color: #666;
        }

        .login-button {
            padding: 1rem 1.25rem;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: #c9a227;
            border: none;
            border-radius: 4px;
            color: #1a1a1a;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #b8922a;
        }

        .login-error {
            color: #e74c3c;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        label.staticrypt-remember {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #888;
            font-size: 0.875rem;
        }

        .staticrypt-remember input[type="checkbox"] {
            transform: scale(1.2);
            accent-color: #c9a227;
        }

        .hidden {
            display: none !important;
        }

        .staticrypt-spinner-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .staticrypt-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 0.25em solid #333;
            border-right-color: #c9a227;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }

        @keyframes spinner-border {
            100% { transform: rotate(360deg); }
        }
    </style>
