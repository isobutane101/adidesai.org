            color: #666;
        }

            background: #b8922a;
        }

            color: #e74c3c;
            font-size: 0.875rem;

        }

        .login-error.show {
            display: block;
        }

            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #888;
            font-size: 0.875rem;
        }

        .staticrypt-remember input[type="checkbox"] {
            transform: scale(1.2);
            accent-color: #c9a227;
        }

        .hidden {
            display: none !important;
        }

            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            border-right-color: #c9a227;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }

        @keyframes spinner-border {
            100% { transform: rotate(360deg); }
        }
