    // A heartbeat timestamp is refreshed every few seconds while this tab is open.
    // On load, if the previous heartbeat is stale (the tab was closed) or missing,
    // the saved password is cleared so the site re-prompts. Reloads and in-site link
    // clicks are near-instant, so their heartbeat is fresh and you stay logged in.
