<!DOCTYPE html>
<html class="staticrypt-html">
<head>
    <script>
    // Auth lifetime: per-tab session. Reloads and clicking links within the site keep you
    // logged in (sessionStorage); closing the tab clears it, so reopening re-prompts.
    // We only make sure no long-term "remember me" survives a tab close.
    (function () {
      try {
        localStorage.removeItem("staticrypt_passphrase");
        localStorage.removeItem("staticrypt_expiration");
      } catch (e) {}
    })();
    </script>

            border-right-color: #c9a227;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }

        @keyframes spinner-border {
            100% { transform: rotate(360deg); }
        }
